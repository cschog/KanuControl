# ===============================
# App Version
# ===============================
app.version=@project.version@
# ===============================
# Server
# ===============================
server.port=8090
spring.application.name=kc_server
spring.main.banner-mode=off

# ===============================
# Vermietung Statusmails (Direktversand aus KC)
# ===============================
kc.mail.smtp.enabled=${KC_SMTP_ENABLED:false}
kc.mail.smtp.test-mode=${KC_SMTP_TEST_MODE:false}
kc.mail.smtp.test-recipient=${KC_SMTP_TEST_RECIPIENT:}
kc.mail.smtp.host=${KC_SMTP_HOST:}
kc.mail.smtp.port=${KC_SMTP_PORT:587}
kc.mail.smtp.username=${KC_SMTP_USERNAME:}
kc.mail.smtp.password=${KC_SMTP_PASSWORD:}
kc.mail.smtp.from=${KC_SMTP_FROM:}
kc.mail.smtp.start-tls=${KC_SMTP_STARTTLS:true}
kc.mail.smtp.ssl=${KC_SMTP_SSL:false}

# ===============================
# Pageable
# ===============================
spring.data.web.pageable.default-page-size=500
spring.data.web.pageable.max-page-size=1000

# ===============================
# JPA
# ===============================
spring.jpa.hibernate.ddl-auto=none
spring.jpa.open-in-view=false

# ===============================
# Logging
# ===============================
# logging.level.org.springframework.boot.context.config=INFO
logging.level.com.kcserver.tenancy=ERROR
logging.level.root=ERROR
logging.level.org.springframework=ERROR
logging.level.com.kcserver=INFO

# ===============================
# Actuator
# ===============================
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=always

# Unabhängige Betriebsumgebung, niemals aus dem Spring-Profil ableiten.
kc.runtime-environment=${KC_ENVIRONMENT:UNKNOWN}
kc.hausmeisterbericht.enabled=false

# Dedicated Home Assistant meter import; opt-in, scoped to one tenant and meter.
kc.meter-import.enabled=${KC_METER_IMPORT_ENABLED:false}
kc.meter-import.key-hash=${KC_METER_IMPORT_KEY_HASH:}
kc.meter-import.tenant=${KC_METER_IMPORT_TENANT:}
kc.meter-import.meter-id=${KC_METER_IMPORT_METER_ID:0}
kc.meter-import.meter-number=${KC_METER_IMPORT_METER_NUMBER:}
kc.meter-import.zone=${KC_METER_IMPORT_ZONE:Europe/Berlin}
